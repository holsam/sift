[project]
name = "sift"
version = "0.3.0"
description = "An interactive file sorter GUI"
readme = "README.md"
authors = [
    { name = "Sam Holland", email = "hol_sam@icloud.com" }
]
requires-python = ">=3.14"
dependencies = [
    "openpyxl>=3.1.5",
    "platformdirs>=4.10.0",
    "pydantic>=2.13.4",
    "pyside6>=6.11.1",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "pyyaml>=6.0.3",
]

[project.scripts]
sift = "sift.sift:main"

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
